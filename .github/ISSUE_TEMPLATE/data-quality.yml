name: Data quality
description: Data that's wrong, missing, or inconsistent while the replay itself runs fine, such as a missed or duplicate moment.
title: "[Data quality] "
labels: ["type:data-quality"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What does the data show?
      description: The query you ran and what came back.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it show?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: How many rows, and which?
      description: Isolated records or systemic? Include a count if you have one.
    validations:
      required: false
  - type: dropdown
    id: coverage
    attributes:
      label: Is there a check for this?
      options:
        - "No, nothing would catch it"
        - "Yes, the 05 Proof saved query returned ok = true anyway"
        - "Yes, the 03c Moments saved query shows it"
        - "Not sure"
    validations:
      required: false
